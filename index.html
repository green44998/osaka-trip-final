
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽婷的關西冒險選擇支線 🗺️</title>
    <style>
        :root {
            --primary-red: #d32f2f; /* 勝尾寺質感紅 */
            --bg-cream: #fffdf5;  /* 柔和奶白底色 */
            --text-dark: #333333;
            --accent-gold: #fbc02d; /* 溫暖金色 */
            --shadow-dark: rgba(211, 47, 47, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            background-color: var(--primary-red);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg-cream);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 頂部波浪與頭像 */
        header {
            background-color: var(--primary-red);
            padding: 40px 20px;
            text-align: center;
            color: white;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 20px var(--shadow-dark);
        }

        .avatar-circle {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        header p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.9;
            font-weight: bold;
        }

        /* 選擇支線區 */
        .branch-container {
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .branch-title {
            text-align: center;
            font-size: 16px;
            color: #777;
            font-weight: bold;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
        }

        /* 關卡選擇卡片 */
        .branch-card {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 25px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1.5px solid #eee;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .branch-card:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .branch-icon {
            font-size: 35px;
            margin-right: 20px;
            background: var(--bg-cream);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #f0e6d2;
        }

        .branch-info {
            flex-grow: 1;
        }

        .branch-info .date {
            font-size: 11px;
            color: var(--primary-red);
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .branch-info .name {
            font-size: 17px;
            font-weight: 800;
            margin: 4px 0;
            color: #111;
        }

        .branch-info .desc {
            font-size: 12px;
            color: #777;
            margin: 0;
            line-height: 1.4;
        }

        .arrow-indicator {
            font-size: 20px;
            color: #ccc;
            margin-left: 10px;
        }

        /* 底部暖心區域 */
        footer {
            padding: 30px 20px;
            text-align: center;
        }

        .companion-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 2px dashed var(--primary-red);
            color: var(--primary-red);
            font-weight: bold;
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <div class="avatar-circle">
            <span style="font-size: 40px;">🌸</span>
        </div>
        <h1>羽婷的關西大冒險</h1>
        <p>13旅行社😘 專屬嚮導系統</p>
    </header>

    <div class="branch-container">
        <div class="branch-title">✨ 請選擇冒險支線關卡 ✨</div>

        <!-- 方案一 (已完全移除日期文字) -->
        <a href="travel.html" class="branch-card">
            <div class="branch-icon">🌱</div>
            <div class="branch-info">
                <div class="date">方案一</div>
                <div class="name">皮克敏冒險地圖</div>
                <div class="desc">麵包、咖啡、海遊館與晚餐抉擇 🌿</div>
            </div>
            <div class="arrow-indicator">➡️</div>
        </a>

        <!-- 方案二 (已完全移除日期文字) -->
        <a href="Katsuo-Ji.html" class="branch-card">
            <div class="branch-icon">⛩️</div>
            <div class="branch-info">
                <div class="date">方案二</div>
                <div class="name">勝尾寺 x 箕面之森</div>
                <div class="desc">必勝不倒翁、大瀑布與梅田血拼 🍁</div>
            </div>
            <div class="arrow-indicator">➡️</div>
        </a>

        <!-- Hotel 飯店周邊指南 -->
        <a href="Hotel-Surroundings.html" class="branch-card">
            <div class="branch-icon">🏪</div>
            <div class="branch-info">
                <div class="date">HOTEL INFO - 飯店周邊</div>
                <div class="name">Hotel 飯店周邊指南</div>
                <div class="desc">超商、深夜拉麵、平價壽司與手作咖啡 🍔</div>
            </div>
            <div class="arrow-indicator">➡️</div>
        </a>
    </div>

    <footer>
        <div class="companion-card">
            準備好開啟今天的冒險了嗎？🚀<br>
            <span style="font-weight: normal; font-size: 13px; color: #666;">
                點選上方任意關卡，即可解鎖當日無腦導航路線！
            </span>
        </div>
    </footer>
</div>

</body>
</html>
