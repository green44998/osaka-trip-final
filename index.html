<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽婷的大阪冒險地圖🗺️</title>
    <style>
        :root { 
            --bg-color: #fdf6ec;      /* 陽光暖奶油色背景 */
            --shadow-dark: #e0d5c1;   
            --shadow-light: #ffffff;  
        }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: #5d4037; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        .title-container {
            text-align: center;
            margin-top: 50px;
        }
        .title {
            color: #e67e22; 
            margin: 0;
            letter-spacing: 2px;
        }
        /* 新增的小字樣式 */
        .subtitle {
            color: #e15f41;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .button-container { 
            width: 90%; 
            max-width: 400px; 
            margin-top: 30px; 
        }
        /* 立體好按的大按鈕 */
        .nav-btn {
            display: block; 
            background: white; 
            color: #d35400; 
            text-decoration: none; 
            font-weight: 900; 
            font-size: 18px; 
            padding: 22px; 
            margin: 25px 0; 
            border-radius: 25px; 
            text-align: center; 
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            border: 2px solid #fff3e0; 
            cursor: pointer; 
            transition: all 0.1s ease;
        }
        /* 手指壓下去的按鈕彈性視覺效果 */
        .nav-btn:active { 
            transform: scale(0.96); 
            box-shadow: inset 4px 4px 10px var(--shadow-dark); 
        }
        .emoji { 
            font-size: 22px; 
            margin-right: 8px; 
            vertical-align: middle; 
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1 class="title">大阪冒險選擇支線☀️</h1>
        <div class="subtitle">你準備好冒險了嗎🤩</div>
    </div>

    <div class="button-container">
        
        <a href="travel.html" class="nav-btn">
            <span class="emoji">🚗</span>自己旅行
        </a>

        <a href="Katsura-Ji.html" class="nav-btn" style="color: #c0392b; border-color: #fce4d6;">
            <span class="emoji">👹</span>勝尾寺
        </a>

    </div>

</body>
</html>
