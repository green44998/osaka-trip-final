<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>必勝運勢！勝尾寺👹</title>
    <style>
        :root { --bg-color: #fdf6ec; --shadow-dark: #e0d5c1; --shadow-light: #ffffff; }
        body { 
            margin: 0; padding: 20px; font-family: -apple-system, sans-serif; 
            background-color: var(--bg-color); color: #5d4037; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        .card { 
            background: white; border-radius: 30px; padding: 25px; margin: 30px 0 15px 0; width: 90%; max-width: 400px; 
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: 1px solid #fce4d6; text-align: center;
        }
        h2 { color: #c0392b; margin-top: 0; }
        .daruma { font-size: 60px; margin: 15px 0; }
        .note { background: #fff5f5; padding: 15px; border-radius: 15px; color: #c0392b; font-size: 14px; line-height: 1.6; text-align: left; border-left: 4px solid #e74c3c; }
        .map-link { display: inline-block; background: #e74c3c; color: white; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 14px; margin-top: 15px; }
        .back-btn { margin-top: 30px; color: #7a8b96; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🍁 勝尾寺 (かつおじ)</h2>
        <div class="daruma">🎯👹🎯</div>
        <p style="font-weight: bold; color: #e74c3c;">求勝運、滿滿達摩的信仰聖地！</p>
        <div class="note">
            💡 **貼心小筆記：**<br>
            ・這裡不管是樹上、石燈籠裡都塞滿了小達摩，超級可愛！<br>
            ・建議可以抽個達摩籤，把好運帶回家～
        </div>
        <a href="https://maps.google.com/?q=Katsuoji+Temple+Osaka" target="_blank" class="map-link">開啟 Google Maps 導航 🗺️</a>
    </div>
    <a href="buttons.html" class="back-btn">⬅️ 返回冒險選擇支線</a>
</body>
</html>
